groups:
  - name: grantledger
    rules:
      - alert: GrantLedgerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "GrantLedger unexpected errors exceed 1%"}
      - alert: GrantLedgerPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "GrantLedger database pool above 90%"}
      - alert: GrantLedgerLockTimeouts
        expr: increase(ledger_lock_timeouts_total[5m]) > 5
        labels: {severity: warning}
        annotations: {summary: "Repeated grant lock timeouts"}
      - alert: GrantLedgerUnavailable
        expr: up{job="grantledger"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "GrantLedger metrics endpoint unavailable; check readiness"}
