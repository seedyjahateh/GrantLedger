name: Release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release identifier, e.g. 1.0.0-rc1'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: bash mvnw -B -ntp spotless:check checkstyle:check verify spotbugs:check cyclonedx:makeAggregateBom
      - name: Publish immutable commit image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" > target/image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: release-evidence, path: "target/bom.json\ntarget/image-digest.txt\ntarget/site/jacoco/"}
      - run: echo 'Institutional deployment is gated by docs/pilot-readiness.md. No real-data deployment is configured in this repository.'
