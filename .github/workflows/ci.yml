name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify Java and PostgreSQL behavior
        run: bash mvnw -B -ntp spotless:check checkstyle:check verify spotbugs:check
      - name: Validate OpenAPI
        run: npm ci && npm run contract:lint
      - name: Check API compatibility against the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:openapi/grantledger-v1.yaml" 2>/dev/null; then
            git show "$BASE_SHA:openapi/grantledger-v1.yaml" > /tmp/grantledger-base.json
            docker run --rm -v /tmp:/base:ro -v "$PWD/openapi:/candidate:ro" tufin/oasdiff:1.11.7 breaking /base/grantledger-base.json /candidate/grantledger-v1.yaml --fail-on ERR
          fi
      - name: Build container
        run: docker build -t grantledger:verify .
      - name: Scan filesystem and image
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.65.0 fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git,target /work
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --severity HIGH,CRITICAL --exit-code 1 grantledger:verify
      - name: Generate SBOM
        run: bash mvnw -B -ntp cyclonedx:makeAggregateBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/bom.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker compose up -d --build
      - name: Wait for application and identity provider
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:9090/actuator/health/readiness && curl -fsS http://localhost:8180/realms/grantledger/.well-known/openid-configuration; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: browser-evidence, path: "playwright-report/"}
      - if: always()
        run: docker compose logs --no-color
  codeql:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with: {languages: java-kotlin, build-mode: manual}
      - run: bash mvnw -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca
