<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Audit history')}"></head><body><header th:replace="~{fragments :: header}"></header><main><h1>Audit history</h1><p><a th:href="@{/grants/{id}(id=${grant.id})}" th:text="${grant.awardNumber}"></a></p><section class="panel" th:each="event : ${results.items}"><h2 th:text="${event.action}"></h2><p><time th:text="${event.occurredAt}"></time> · <span th:text="${event.actorSubject}"></span></p><p class="muted" th:text="${event.actorIssuer}"></p><p th:if="${event.reason}" th:text="${event.reason}"></p><details><summary>Recorded change</summary><h3>Before</h3><pre th:text="${event.beforeValues}"></pre><h3>After</h3><pre th:text="${event.afterValues}"></pre><p th:text="'Request ' + ${event.requestId}"></p></details></section><nav class="pagination" aria-label="Audit pages"><a th:if="${results.page > 0}" th:href="@{/grants/{id}/audit(id=${grant.id},page=${results.page - 1})}">Previous</a><span th:text="${results.totalElements} + ' events'"></span><a th:if="${results.page + 1 < results.totalPages}" th:href="@{/grants/{id}/audit(id=${grant.id},page=${results.page + 1})}">Next</a></nav></main></body></html>
