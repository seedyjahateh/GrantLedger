<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Close grant')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="narrow"><h1>Reconcile and close</h1><p th:text="${grant.awardNumber} + ' — ' + ${grant.title}"></p><aside class="notice">A closed grant cannot be reopened in this release. Complete corrections and compare the ledger with the official finance system before closing.</aside><form class="panel form" method="post" th:action="@{/grants/{id}/close(id=${grant.id})}"><input type="hidden" name="version" th:value="${grant.version}"><label for="reconciliationNote">Reconciliation note</label><textarea id="reconciliationNote" name="reconciliationNote" maxlength="500" required></textarea><label class="check"><input name="confirmed" type="checkbox" value="true" required>I have reconciled this grant and confirm permanent closure.</label><button>Close grant</button><a th:href="@{/grants/{id}(id=${grant.id})}">Cancel</a></form></main></body></html>
