<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Reverse expense')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="narrow"><h1>Reverse this expense</h1><p>A new reversal will restore <strong th:text="${entry.amount} + ' USD'"></strong> to <span th:text="${entry.category}"></span>. Both records remain in the ledger.</p><p th:text="${entry.description}"></p><form class="panel form" method="post" th:action="@{/grants/{id}/entries/{entryId}/reverse(id=${grant.id},entryId=${entry.id})}"><input type="hidden" name="idempotencyKey" th:value="${idempotencyKey}"><label for="reason">Reason for correction</label><textarea id="reason" name="reason" maxlength="500" required></textarea><label class="check"><input name="confirmed" type="checkbox" value="true" required>I confirm this full reversal.</label><button>Confirm reversal</button><a th:href="@{/grants/{id}(id=${grant.id})}">Cancel</a></form></main></body></html>
