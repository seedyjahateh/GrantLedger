<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Grants')}"></head><body><header th:replace="~{fragments :: header}"></header><main>
<div class="heading"><div><p class="eyebrow">Research accounts</p><h1>Your grants</h1><p>Review funding, activity, and available category budgets.</p></div><a th:if="${admin}" class="button" th:href="@{/grants/new}">Create grant</a></div>
<aside th:replace="~{fragments :: notice}"></aside><form method="get" th:action="@{/grants}" class="search"><label for="search">Search award number or title</label><input id="search" name="search" th:value="${search}" maxlength="200"><button>Search</button></form>
<section class="panel"><table><caption>Grants in your authorized departments</caption><thead><tr><th>Award</th><th>Title</th><th>Status</th><th>Award amount (USD)</th></tr></thead><tbody><tr th:each="grant : ${results.items}"><td><a th:href="@{/grants/{id}(id=${grant.id})}" th:text="${grant.awardNumber}"></a></td><td th:text="${grant.title}"></td><td><span class="badge" th:text="${grant.status}"></span></td><td class="money" th:text="${grant.awardAmount}"></td></tr><tr th:if="${results.items.empty}"><td colspan="4">No grants match this search.</td></tr></tbody></table></section>
<nav class="pagination" aria-label="Pagination"><a th:if="${results.page > 0}" th:href="@{/grants(page=${results.page - 1},search=${search})}">Previous</a><span th:text="${results.totalElements} + ' grants'"></span><a th:if="${results.page + 1 < results.totalPages}" th:href="@{/grants(page=${results.page + 1},search=${search})}">Next</a></nav></main></body></html>
